name: Release Mikan Pet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e .

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build Installer & Portable Archive
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build.ps1 -Python (Get-Command python).Source

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/MikanPet-Setup-x64.exe
            dist/MikanPet-portable-x64.zip
          generate_release_notes: true
