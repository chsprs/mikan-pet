name: Release Mikan Pet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e .

      - name: Build signed package when certificate is configured
        shell: powershell
        run: |
          $parameters = @{
            Python = (Get-Command python).Source
            Architecture = 'x64'
          }
          if ($env:WINDOWS_CERT_BASE64) {
            if (-not $env:WINDOWS_CERT_PASSWORD) {
              throw 'WINDOWS_CERT_PASSWORD is required when WINDOWS_CERT_BASE64 is configured.'
            }
            $certificatePath = Join-Path $env:RUNNER_TEMP 'mikan-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            $parameters.SigningCertificatePath = $certificatePath
            $parameters.SigningCertificatePassword = $env:WINDOWS_CERT_PASSWORD
          }
          & .\scripts\build.ps1 @parameters

      - name: Smoke-test installer install and uninstall
        shell: powershell
        run: |
          .\scripts\test_installer.ps1 `
            -Installer ".\dist\MikanPet-Setup-x64.exe" `
            -InstallDirectory "$env:RUNNER_TEMP\MikanPet-x64"

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: mikan-pet-x64
          if-no-files-found: error
          path: dist/MikanPet-Setup-x64.exe

  release:
    name: Publish verified release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download verified packages
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $previousTag = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($previousTag) { "$previousTag..$tag" } else { $tag }
          $commits = git log $range --pretty=format:"- %s (%h)"
          $notes = @"
          ### Mikan Pet $tag

          Paket rilis:
          - MikanPet-Setup-x64.exe: installer Windows x64

          Perubahan:

          $commits
          "@
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'release_notes.md'),
            $notes,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: release-assets/MikanPet-Setup-x64.exe
